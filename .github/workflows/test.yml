name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline checks (items, settings, retrieval, schedule, QR)
        run: node test/smoke.mjs
      - name: Settings page render check (React stub)
        run: node test/client-render.mjs
